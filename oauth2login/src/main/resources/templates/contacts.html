<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contacts</title>
</head>
<body>
    <h1>Google Contacts</h1>

    <!-- Add Contact Form -->
    <form action="/create" method="post">
        <input type="text" name="givenName" placeholder="First Name" required>
        <input type="text" name="familyName" placeholder="Last Name (Optional)">
        <input type="email" name="email" placeholder="Email (Optional)">
        <input type="text" name="phoneNumber" placeholder="Phone (Optional)">
        <button type="submit">Add Contact</button>
    </form>    

    <hr>

    <!-- Contact List -->
    <!-- Iterate over contacts -->
    <div th:each="contact : ${contacts}">
        <strong>Names:</strong>
        <h5 th:text="${contact.names != null and not #lists.isEmpty(contact.names) ? contact.names[0].displayName : 'Unnamed Contact'}">
            Contact Name
        </h5>
    
        <!-- Display all email addresses -->
        <div th:if="${contact.emailAddresses != null and not #lists.isEmpty(contact.emailAddresses)}">
            <strong>Emails:</strong>
            <ul>
                <li th:each="email : ${contact.emailAddresses}" th:text="${email.value}"></li>
            </ul>
        </div>
    
        <!-- Display all phone numbers -->
        <div th:if="${contact.phoneNumbers != null and not #lists.isEmpty(contact.phoneNumbers)}">
            <strong>Phones:</strong>
            <ul>
                <li th:each="phone : ${contact.phoneNumbers}" th:text="${phone.value}"></li>
            </ul>
        </div>
    
        <!-- Edit Contact Button -->
        <form action="/edit" method="get">
            <input type="hidden" name="resourceName" th:value="${contact.resourceName}">
            <button type="submit">Edit</button>
        </form>
    
        <!-- Delete Contact Button -->
        <form action="/delete" method="post">
            <input type="hidden" name="resourceName" th:value="${contact.resourceName}">
            <button type="submit" onclick="return confirm('Are you sure you want to delete this contact?');">Delete</button>
        </form>
    </div>    
</body>
</html>
